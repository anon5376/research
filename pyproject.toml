[project]
name = "virtual-cell-challenge"
version = "0.1.0"
description = "Personal entry for the 2026 Arc Institute Virtual Cell Challenge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "anon5376" }]
dependencies = [
    "anndata>=0.11",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
]

[project.scripts]
vcc-baseline = "vcc_entry.baseline:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcc_entry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
