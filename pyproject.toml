[project]
name = "research"
version = "0.1.0"
description = "Personal research notes and experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "anon5376" }]
dependencies = [
    "anndata>=0.11",
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
]

[project.scripts]
vcc-baseline = "vcc_entry.baseline:main"
tahoe-slice = "tahoe.cli:main"
tahoe-train = "tahoe.train:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcc_entry", "src/tahoe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
